# Git hooks (lefthook, pinned in mise.toml). Install them with `mise run hooks` (`mise run setup`
# does it too). Fast checks on staged files, no test suites: linters and formatters, and the
# backend's Spotless, Checkstyle and ArchUnit rules only when Java files are staged. `mise run check`
# runs every structure check, lint, formatting check and the type-check by hand. CI runs every
# check either way, since hooks can be skipped (`git commit --no-verify`).
# See doc/coding-convention/repository-git-hooks.md.

# Run lefthook, and the commands below, with the tools from mise.toml on PATH (uv, Java).
lefthook: mise exec -- lefthook

# `**/` also matches no folder at all, so files at a project's root are checked too.
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: frontend lint
      root: artifact/frontend/
      glob: "artifact/frontend/**/*.{ts,vue,js}"
      run: ./with-node.sh pnpm exec eslint {staged_files}

    - name: frontend format
      root: artifact/frontend/
      glob: "artifact/frontend/**/*"
      run: ./with-node.sh pnpm exec prettier --check --ignore-unknown {staged_files}

    - name: ta-runner lint
      root: artifact/ta-runner/
      glob: "artifact/ta-runner/**/*.py"
      run: uv run ruff check {staged_files}

    - name: ta-runner import contracts
      root: artifact/ta-runner/
      glob: ["artifact/ta-runner/**/*.py", "artifact/ta-runner/pyproject.toml"]
      run: uv run lint-imports

    # Formatting (Spotless) of the Java files changed since HEAD, Checkstyle on every backend module,
    # and only ArchitectureTest, no other test: one Gradle run. CI checks the formatting of every
    # file. ArchUnit needs the backend compiled: seconds with a warm Gradle daemon, longer from a
    # cold one. Gradle checks and compiles the working tree, unstaged edits included.
    - name: backend format (Spotless), Checkstyle and package structure (ArchUnit)
      glob: "artifact/backend/**/*.java"
      run: >-
        ./gradlew --console=plain spotlessCheck -PspotlessRatchetFrom=HEAD
        checkstyleMain checkstyleTest :backend:test --tests '*ArchitectureTest'
