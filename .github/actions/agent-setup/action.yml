# Shared setup of the agent workflows (agent-implement.yml, agent-loop.yml): the push token, the
# repository with full history, the toolchain as CI has it (mise, Gradle, Node.js / pnpm, uv), the
# Git hooks and Claude Code. See doc/coding-convention/repository-agentic-development.md.
#
# Pushes made with the workflow's GITHUB_TOKEN start no workflow, so CI would not run on the
# agents' commits: they push with a GitHub App's installation token (preferred: short-lived,
# scoped to this repository) or, without an App, a fine-grained personal access token.

name: Agent setup
description: Token, checkout, toolchain and Claude Code for the agent scripts

inputs:
  app-id:
    description: GitHub App ID (vars.AGENT_APP_ID); empty to use `token`
    default: ""
  app-private-key:
    description: The App's private key (secrets.AGENT_APP_PRIVATE_KEY)
    default: ""
  token:
    description: Fine-grained personal access token (secrets.AGENT_GITHUB_TOKEN), used without an App
    default: ""
  claude-code-version:
    description: Claude Code (npm @anthropic-ai/claude-code) version
    default: "2.1.289"

runs:
  using: composite
  steps:
    - name: App token
      id: app
      if: inputs.app-id != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: Agent token
      id: token
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app.outputs.token }}
        PAT: ${{ inputs.token }}
      run: |
        token=${APP_TOKEN:-$PAT}
        [ -n "$token" ] || { echo "::error::Set vars.AGENT_APP_ID and secrets.AGENT_APP_PRIVATE_KEY, or secrets.AGENT_GITHUB_TOKEN."; exit 1; }
        echo "token=$token" >> "$GITHUB_OUTPUT"

    # The default branch: the scripts switch to the plan branch themselves, running the scripts and
    # prompts of the default branch.
    - uses: actions/checkout@v7
      with:
        token: ${{ steps.token.outputs.token }}
        fetch-depth: 0

    - name: Commit identity and GitHub login of the agents
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        APP_SLUG: ${{ steps.app.outputs.app-slug }}
      run: |
        if [ -n "$APP_SLUG" ]; then
          login="$APP_SLUG[bot]"
        else
          login=$(gh api user --jq .login)
        fi
        id=$(gh api "users/$login" --jq .id)
        git config --global user.name "$login"
        git config --global user.email "$id+$login@users.noreply.github.com"
        {
          echo "AGENT_GITHUB_LOGIN=$login"
          echo "GH_TOKEN=${{ steps.token.outputs.token }}"
        } >> "$GITHUB_ENV"

    - name: Java and uv (versions from mise.toml)
      uses: jdx/mise-action@v5

    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v6

    - name: Node, pnpm and packages cache
      uses: actions/cache@v6
      with:
        path: |
          artifact/frontend/.gradle/nodejs
          artifact/frontend/.gradle/pnpm
          ~/.local/share/pnpm/store
        key: frontend-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'artifact/frontend/pnpm-lock.yaml') }}
        restore-keys: frontend-${{ runner.os }}-

    - name: uv cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('artifact/ta-runner/uv.lock') }}
        restore-keys: uv-${{ runner.os }}-

    # ta-runner, the frontend's packages and the Git hooks: the agents commit through the hooks.
    - name: Project setup
      shell: bash
      run: mise run setup

    - name: Claude Code
      shell: bash
      run: |
        npm install --global "@anthropic-ai/claude-code@${{ inputs.claude-code-version }}"
        claude --version
