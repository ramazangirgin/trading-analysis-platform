# Continuous integration: every push to main, every pull request, and on demand. A branch without
# a pull request has no CI until one is opened. Jobs; add new ones (image publishing, security
# scans, ...) next to them and list them under ci-passed:
#
#   changes    which areas the change touches (scripts/ci-changes.sh, tested by
#              scripts/test-ci-changes.sh); the jobs below skip what the change cannot affect:
#                app         anything but docs, plans, the agent pipeline: build, jar, e2e, images,
#                            runner-image, runner-image-arm64
#                runner      app, or scripts/agent and .claude/skills: runner
#                deploy      deploy/, mise.toml, .github/: server
#                server_e2e  deploy/, the ta-runner Dockerfile, this workflow, scripts/ci-changes.sh:
#                            server-e2e
#              On demand, on main and when no base is found, everything runs: release.yml releases
#              the jar of a run on main.
#   build      backend + frontend: formatting first (Spotless, Prettier), in the same Gradle run as
#              Checkstyle, all Gradle tests (ArchUnit, Docker runner against the runner's Docker,
#              every repository and Spring Boot test on PostgreSQL in a container through
#              Testcontainers), dependency analysis (Gradle), frontend lint, tests and Knip
#   jar        the single jar, built on its own so the jar consumers (images, e2e) start while build
#              still tests; a red build still fails ci-passed, so that jar is never released
#   runner     ta-runner: ruff, import-linter (package structure), deptry and pytest, upstream
#              contract tests included; also the Python tests of the agent scripts (scripts/agent)
#   runner-image  the ta-runner image and its lockdown check, beside the build job
#   runner-image-arm64  the same image built and checked on arm64, for arm64 servers: a missing
#              arm64 wheel shows up here, before a deploy
#   server     the server deployment (deploy/server/): ansible-lint, the playbook's syntax, and the
#              setup scripts against a throwaway Ubuntu container (server:test-setup)
#   server-e2e the server deployment end to end, this runner being the server (server:test)
#   images     the platform image, then the Docker Compose smoke test (deploy/smoke-test.sh);
#              needs jar and runner-image
#   e2e        end-to-end tests (e2e/, Playwright) in parallel (playwright.config.ts), and the e2e
#              formatting: the jar job's jar in Google Chrome, with ta-runner replaying a
#              recording instead of calling an LLM, the jar on a throwaway PostgreSQL container
#              (scripts/postgres.sh)
#   version    the version is the same in every file; in a pull request into main, it is also
#              higher than main's and than the latest release tag (scripts/version.sh); Renovate's
#              update pull requests are exempt from the bump
#   ci-passed  "CI passed": the one check main's ruleset requires before a pull request can merge;
#              a skipped job counts as passed, a failed or cancelled one does not
#
# A successful run on main is released by release.yml (tag vX.Y.Z, GitHub Release with the jar).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # mise asks before using a repository's mise.toml; in CI this checkout is trusted.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.areas.outputs.app }}
      runner: ${{ steps.areas.outputs.runner }}
      deploy: ${{ steps.areas.outputs.deploy }}
      server_e2e: ${{ steps.areas.outputs.server_e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The script's tests
        run: bash scripts/test-ci-changes.sh

      # Only a pull request has a base; on demand and on main everything runs.
      - name: Areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD || true)
          fi
          bash scripts/ci-changes.sh "$base" >> "$GITHUB_OUTPUT"

  build:
    name: Backend and frontend
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Java and uv (versions from mise.toml)
        uses: jdx/mise-action@v5

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Node and pnpm are downloaded by the build itself (node-gradle); keep them and pnpm's store.
      - name: Node, pnpm and packages cache
        uses: actions/cache@v6
        with:
          path: |
            artifact/frontend/.gradle/nodejs
            artifact/frontend/.gradle/pnpm
            ~/.local/share/pnpm/store
          key: frontend-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'artifact/frontend/pnpm-lock.yaml') }}
          restore-keys: frontend-${{ runner.os }}-

      # Formatting of every file, not only the changed ones: the pre-commit hook checks only what a
      # commit changes, and can be skipped. The formatting tasks come first on the command line and
      # depend on nothing but pnpmInstall, so Gradle starts them first; without --continue, a
      # formatting failure stops the build before any later task starts (tasks already running in
      # parallel finish). `build` includes the other Spotless checks and the frontend's Prettier
      # check already; the e2e formatting is checked in the e2e job. Locally, `mise run
      # format-check` checks every file, e2e included.
      - name: Formatting, build and test
        run: ./gradlew --console=plain spotlessCheck :frontend:pnpmLint build

      - name: Test and Checkstyle reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            artifact/**/build/reports/tests/
            artifact/**/build/test-results/
            artifact/**/build/reports/checkstyle/
            artifact/**/build/reports/dependency-analyze/
          if-no-files-found: ignore

  # The jar needs no test result: the images and e2e jobs start from it while build still tests.
  jar:
    name: Platform jar
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Java and uv (versions from mise.toml)
        uses: jdx/mise-action@v5

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Node, pnpm and packages cache
        uses: actions/cache@v6
        with:
          path: |
            artifact/frontend/.gradle/nodejs
            artifact/frontend/.gradle/pnpm
            ~/.local/share/pnpm/store
          key: frontend-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'artifact/frontend/pnpm-lock.yaml') }}
          restore-keys: frontend-${{ runner.os }}-

      - name: Build the jar
        run: ./gradlew --console=plain :backend:bootJar

      - name: Platform jar (for the images and e2e jobs)
        uses: actions/upload-artifact@v7
        with:
          name: platform-jar
          path: artifact/backend/build/libs/platform.jar
          if-no-files-found: error
          retention-days: 3

  runner:
    name: ta-runner
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Java and uv (versions from mise.toml)
        uses: jdx/mise-action@v5

      - name: uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('artifact/ta-runner/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Lint and test
        run: mise run runner-test

      - name: Agent scripts' Python tests (scripts/agent)
        run: mise run agent:test

      - name: Skill helpers' Python tests (.claude/skills)
        run: mise run skill:test

  # Beside the build job: the image and its lockdown check need nothing from it. The image goes to
  # the images job as an artifact, so the smoke test runs the very image that passed the check.
  runner-image:
    name: ta-runner image
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: ta-runner image
        uses: docker/build-push-action@v7
        with:
          context: artifact/ta-runner
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ta-runner:${{ steps.version.outputs.version }}
            ta-runner:latest
          load: true
          cache-from: type=gha,scope=ta-runner
          cache-to: type=gha,scope=ta-runner,mode=max

      - name: ta-runner image under the platform's lockdown
        run: |
          flags=(--rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 1)
          image=ta-runner:${{ steps.version.outputs.version }}
          docker run "${flags[@]}" "$image" version | jq -e --arg v "${{ steps.version.outputs.version }}" '.runner_version == $v'
          docker run "${flags[@]}" "$image" catalog | jq -e '.providers | length > 0'
          docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' | grep -Fx "${{ steps.version.outputs.version }}"

      - name: Save the image (for the images job)
        run: docker save "ta-runner:${{ steps.version.outputs.version }}" ta-runner:latest -o "$RUNNER_TEMP/ta-runner-image.tar"

      - name: ta-runner image (for the images job)
        uses: actions/upload-artifact@v7
        with:
          name: ta-runner-image
          path: ${{ runner.temp }}/ta-runner-image.tar
          if-no-files-found: error
          retention-days: 1

  # An arm64 server builds the image itself: build it on arm64 here to find a Python dependency
  # without an arm64 wheel. Not the platform image: its JRE image is multi-arch and the jar is plain Java.
  runner-image-arm64:
    name: ta-runner image (arm64)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: ta-runner image
        uses: docker/build-push-action@v7
        with:
          context: artifact/ta-runner
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ta-runner:${{ steps.version.outputs.version }}
          load: true
          cache-from: type=gha,scope=ta-runner-arm64
          cache-to: type=gha,scope=ta-runner-arm64,mode=max

      - name: ta-runner image under the platform's lockdown
        run: |
          flags=(--rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 1)
          image=ta-runner:${{ steps.version.outputs.version }}
          docker run "${flags[@]}" "$image" version | jq -e --arg v "${{ steps.version.outputs.version }}" '.runner_version == $v'
          docker run "${flags[@]}" "$image" catalog | jq -e '.providers | length > 0'
          docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' | grep -Fx "${{ steps.version.outputs.version }}"

  # The Ansible code is checked without a server. Installing the Ansible tools is why this is a job
  # of its own and not part of `mise run check`.
  server:
    name: Server deploy (Ansible)
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Ansible and ansible-lint (versions from mise.toml)
        uses: jdx/mise-action@v5

      - name: ansible-lint and the playbook's syntax
        run: mise run server:check

      - name: Setup scripts against a throwaway Ubuntu container
        run: mise run server:test-setup

  # The whole deployment, as deploy/server/README.md describes it, with this runner as the server:
  # the setup scripts, then deploys over SSH to 127.0.0.1 (deploy/server/test-deploy.sh). It builds
  # the images on the "server" (20 to 30 minutes), so it runs only when what it tests changes
  # (the server_e2e area). mise.toml is not one: the server job installs the same tools from it.
  server-e2e:
    name: Server deploy end-to-end
    needs: changes
    if: needs.changes.outputs.server_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # test-deploy.sh pushes HEAD to a bare repository, which refuses a shallow update
          fetch-depth: 0

      - name: Ansible (versions from mise.toml)
        uses: jdx/mise-action@v5

      - name: Deploy to this runner over SSH, as the README's steps do
        run: mise run server:test

  images:
    name: Platform image and Compose smoke test
    needs: [jar, runner-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Platform jar
        uses: actions/download-artifact@v8
        with:
          name: platform-jar
          path: artifact/backend/build/libs

      - name: ta-runner image
        uses: actions/download-artifact@v8
        with:
          name: ta-runner-image
          path: ${{ runner.temp }}

      - name: Load the ta-runner image
        run: docker load -i "$RUNNER_TEMP/ta-runner-image.tar"

      - name: Version
        id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            trading-analysis-platform:${{ steps.version.outputs.version }}
            trading-analysis-platform:latest
          load: true
          cache-from: type=gha,scope=platform
          cache-to: type=gha,scope=platform,mode=max

      - name: Docker Compose smoke test
        run: deploy/smoke-test.sh "$RUNNER_TEMP/platform-data"

  # It needs the jar from the jar job. Traces and the HTML report are uploaded on failure.
  e2e:
    name: End-to-end tests
    needs: jar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Java and uv (versions from mise.toml)
        uses: jdx/mise-action@v5

      # The same Node.js and pnpm as the frontend's build (e2e/with-node.sh uses them).
      - name: Node, pnpm and packages cache
        id: node
        uses: actions/cache@v6
        with:
          path: |
            artifact/frontend/.gradle/nodejs
            artifact/frontend/.gradle/pnpm
            ~/.local/share/pnpm/store
            e2e/node_modules
          key: e2e-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'e2e/pnpm-lock.yaml') }}
          restore-keys: e2e-${{ runner.os }}-

      # Only an exact hit lets the setup be skipped: after a partial restore, an older Node.js may
      # be the only one in .gradle/nodejs, and with-node.sh would pick it.
      - name: Gradle cache
        if: steps.node.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v6

      # The venv links to the Python that uv downloaded, so both are cached together. No restore
      # key: a partial venv is not worth restoring.
      - name: ta-runner venv cache
        id: venv
        uses: actions/cache@v6
        with:
          path: |
            artifact/ta-runner/.venv
            ~/.local/share/uv/python
          key: ta-runner-venv-${{ runner.os }}-${{ hashFiles('artifact/ta-runner/uv.lock', 'artifact/ta-runner/pyproject.toml', 'artifact/ta-runner/.python-version', 'mise.toml') }}

      - name: uv cache
        if: steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('artifact/ta-runner/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Platform jar
        uses: actions/download-artifact@v8
        with:
          name: platform-jar
          path: artifact/backend/build/libs

      - name: Node.js and pnpm
        if: steps.node.outputs.cache-hit != 'true'
        run: ./gradlew --console=plain :frontend:nodeSetup :frontend:pnpmSetup

      # The installs always run: on a cache hit they take about a second, and they prove that the
      # cached tree matches the lock file.
      - name: ta-runner packages
        working-directory: artifact/ta-runner
        run: uv sync --frozen

      - name: e2e packages
        run: e2e/with-node.sh pnpm install --frozen-lockfile

      # The tests run in Google Chrome, which GitHub's Ubuntu runners have installed.
      - name: Google Chrome
        run: google-chrome --version

      - name: Type-check and formatting
        run: |
          e2e/with-node.sh pnpm run type-check
          e2e/with-node.sh pnpm run format-check

      - name: End-to-end tests
        run: e2e/with-node.sh pnpm test

      - name: Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Full history and tags: the check compares with main and with the release tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Same version in every file
        run: scripts/version.sh check-sync

      # main must only ever move to a new release: the merged pull request's version is tagged and
      # released by release.yml. Renovate's update pull requests are exempt: the hosted app cannot
      # run scripts/version.sh, so they ship with the next release
      # (docs/coding-convention/repository-versioning-and-releases.md).
      - name: Version bumped (pull requests into main, except Renovate's)
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main'
          && !(startsWith(github.head_ref, 'renovate/') && github.event.pull_request.user.login == 'renovate[bot]')
        run: scripts/version.sh check-bump "origin/${{ github.base_ref }}"

  # The single required check: it passes only if every job above passed, so new jobs are covered by
  # adding them to `needs` without touching the repository's rules.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, build, jar, runner, runner-image, runner-image-arm64, server, server-e2e, images, version, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "Not all jobs passed."; exit 1 ;;
            esac
          done
