# Continuous integration: every push to any branch (main included), every pull request, and on
# demand. Jobs; add new ones (image publishing, security scans, ...) next to them and list them
# under ci-passed:
#
#   build      backend + frontend: formatting of every file (Spotless, Prettier), Checkstyle, all
#              Gradle tests (ArchUnit, Docker runner against the runner's Docker, every
#              repository and Spring Boot test on PostgreSQL in a container through Testcontainers),
#              dependency analysis (Gradle), frontend lint, tests and Knip, the single jar
#   runner     ta-runner: ruff, import-linter (package structure), deptry and pytest, upstream
#              contract tests included; also the Python tests of the agent scripts (scripts/agent)
#   images    both Docker images, then the Docker Compose smoke test (deploy/smoke-test.sh)
#   e2e        end-to-end tests (e2e/, Playwright): the build job's jar in Google Chrome, with
#              ta-runner replaying a recording instead of calling an LLM, the jar on a throwaway
#              PostgreSQL container (scripts/postgres.sh)
#   version    the version is the same in every file; in a pull request into main, it is also
#              higher than main's and than the latest release tag (scripts/version.sh); Renovate's
#              update pull requests are exempt from the bump
#   ci-passed  "CI passed": the one check main's ruleset requires before a pull request can merge
#
# A successful run on main is released by release.yml (tag vX.Y.Z, GitHub Release with the jar).
#
# Pull requests run even when their branch already ran on push: a skipped required check would
# count as passed.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # mise asks before using a repository's mise.toml; in CI this checkout is trusted.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  build:
    name: Backend and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Java and uv (versions from mise.toml)
        uses: jdx/mise-action@v5

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Node and pnpm are downloaded by the build itself (node-gradle); keep them and pnpm's store.
      - name: Node, pnpm and packages cache
        uses: actions/cache@v6
        with:
          path: |
            artifact/frontend/.gradle/nodejs
            artifact/frontend/.gradle/pnpm
            ~/.local/share/pnpm/store
          key: frontend-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'artifact/frontend/pnpm-lock.yaml') }}
          restore-keys: frontend-${{ runner.os }}-

      # Every file, not only the changed ones: the pre-commit hook checks only what a commit
      # changes, and can be skipped. Before the build, so an unformatted file fails fast.
      - name: Formatting (Java and frontend, every file)
        run: mise run format-check

      - name: Build and test
        run: mise run build

      - name: Test and Checkstyle reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            artifact/**/build/reports/tests/
            artifact/**/build/test-results/
            artifact/**/build/reports/checkstyle/
            artifact/**/build/reports/dependency-analyze/
          if-no-files-found: ignore

      - name: Platform jar (for the images job)
        uses: actions/upload-artifact@v7
        with:
          name: platform-jar
          path: artifact/backend/build/libs/platform.jar
          if-no-files-found: error
          retention-days: 3

  runner:
    name: ta-runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Java and uv (versions from mise.toml)
        uses: jdx/mise-action@v5

      - name: uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('artifact/ta-runner/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Lint and test
        run: mise run runner-test

      - name: Agent scripts' Python tests (scripts/agent)
        run: mise run agent:test

  images:
    name: Docker images and Compose smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Platform jar
        uses: actions/download-artifact@v8
        with:
          name: platform-jar
          path: artifact/backend/build/libs

      - name: Version
        id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: ta-runner image
        uses: docker/build-push-action@v7
        with:
          context: artifact/ta-runner
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ta-runner:${{ steps.version.outputs.version }}
            ta-runner:latest
          load: true
          cache-from: type=gha,scope=ta-runner
          cache-to: type=gha,scope=ta-runner,mode=max

      - name: Platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            trading-analysis-platform:${{ steps.version.outputs.version }}
            trading-analysis-platform:latest
          load: true
          cache-from: type=gha,scope=platform
          cache-to: type=gha,scope=platform,mode=max

      - name: ta-runner image under the platform's lockdown
        run: |
          flags=(--rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 1)
          image=ta-runner:${{ steps.version.outputs.version }}
          docker run "${flags[@]}" "$image" version | jq -e --arg v "${{ steps.version.outputs.version }}" '.runner_version == $v'
          docker run "${flags[@]}" "$image" catalog | jq -e '.providers | length > 0'
          docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' | grep -Fx "${{ steps.version.outputs.version }}"

      - name: Docker Compose smoke test
        run: deploy/smoke-test.sh "$RUNNER_TEMP/platform-data"

  # Last: it needs the jar from the build job. Traces and the HTML report are uploaded on failure.
  e2e:
    name: End-to-end tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Java and uv (versions from mise.toml)
        uses: jdx/mise-action@v5

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # The same Node.js and pnpm as the frontend's build (e2e/with-node.sh uses them).
      - name: Node, pnpm and packages cache
        uses: actions/cache@v6
        with:
          path: |
            artifact/frontend/.gradle/nodejs
            artifact/frontend/.gradle/pnpm
            ~/.local/share/pnpm/store
          key: e2e-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'e2e/pnpm-lock.yaml') }}
          restore-keys: e2e-${{ runner.os }}-

      - name: uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('artifact/ta-runner/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Platform jar
        uses: actions/download-artifact@v8
        with:
          name: platform-jar
          path: artifact/backend/build/libs

      - name: Node.js, pnpm, ta-runner and the e2e packages
        run: |
          ./gradlew --console=plain :frontend:nodeSetup :frontend:pnpmSetup
          (cd artifact/ta-runner && uv sync --frozen)
          e2e/with-node.sh pnpm install --frozen-lockfile

      # The tests run in Google Chrome, which GitHub's Ubuntu runners have installed.
      - name: Google Chrome
        run: google-chrome --version

      - name: Type-check
        run: e2e/with-node.sh pnpm run type-check

      - name: End-to-end tests
        run: e2e/with-node.sh pnpm test

      - name: Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Full history and tags: the check compares with main and with the release tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Same version in every file
        run: scripts/version.sh check-sync

      # main must only ever move to a new release: the merged pull request's version is tagged and
      # released by release.yml. Renovate's update pull requests are exempt: the hosted app cannot
      # run scripts/version.sh, so they ship with the next release
      # (docs/coding-convention/repository-versioning-and-releases.md).
      - name: Version bumped (pull requests into main, except Renovate's)
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main'
          && !(startsWith(github.head_ref, 'renovate/') && github.event.pull_request.user.login == 'renovate[bot]')
        run: scripts/version.sh check-bump "origin/${{ github.base_ref }}"

  # The single required check: it passes only if every job above passed, so new jobs are covered by
  # adding them to `needs` without touching the repository's rules.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build, runner, images, version, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "Not all jobs passed."; exit 1; }
          done
