[project]
name = "ta-runner"
# The platform's version (scripts/version.sh), read from ta_runner/__init__.py.
dynamic = ["version"]
description = "Non-interactive, single-run executor for TradingAgents that emits JSONL events (see docs/event-protocol.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The ONLY place the platform touches TradingAgents code. Pinned to a release tag, fetched as
    # GitHub's archive of that tag (no git needed, in the image or locally; uv.lock pins its hash).
    # Bump it together with engine/compat.py and the contract tests. Renovate's
    # weekly update pull request includes it (.github/renovate.json5): run `uv lock` and adapt
    # compat.py on that branch before merging.
    "tradingagents @ https://github.com/TauricResearch/TradingAgents/archive/refs/tags/v0.5.1.tar.gz",
]

[project.scripts]
ta-runner = "ta_runner.__main__:main"

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "pytest>=8.4",
    "ruff>=0.15",
]

[tool.uv]
# Only releases at least 14 days old, as Renovate's minimumReleaseAge: Renovate cannot check the
# versions uv picks when it regenerates uv.lock (lock file maintenance).
exclude-newer = "14 days"
# Intel Macs: several packages stopped publishing x86_64 macOS wheels, and building them
# needs a Rust toolchain. Pin to the last releases with universal2 wheels, on Intel Macs only.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ta_runner/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

# Package structure: docs/coding-convention/ta-runner-python-package-structure.md.
[tool.ruff.lint.flake8-tidy-imports]
# Relative imports only within one sub-package; across sub-packages they name the target in full.
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tradingagents".msg = "Only ta_runner/engine/compat.py imports TradingAgents (BE-0002)."

[tool.ruff.lint.per-file-ignores]
"ta_runner/engine/compat.py" = ["TID251"]
"tests/engine/test_upstream_contract.py" = ["TID251"]

# import-linter (`lint-imports`): which part of ta_runner may import which.
[tool.importlinter]
root_packages = ["ta_runner"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: __main__ -> catalog -> engine -> pricing -> protocol"
type = "layers"
containers = ["ta_runner"]
layers = ["__main__", "catalog", "engine", "pricing", "protocol"]

[[tool.importlinter.contracts]]
name = "Only engine.compat imports TradingAgents"
type = "forbidden"
source_modules = ["ta_runner"]
forbidden_modules = ["tradingagents"]
ignore_imports = ["ta_runner.engine.compat -> tradingagents"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only engine imports LangChain"
type = "forbidden"
source_modules = ["ta_runner.__main__", "ta_runner.catalog", "ta_runner.pricing", "ta_runner.protocol"]
forbidden_modules = ["langchain_core", "langchain", "langgraph"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "protocol and pricing stay free of the engine's dependencies"
type = "forbidden"
source_modules = ["ta_runner.protocol", "ta_runner.pricing"]
forbidden_modules = ["tradingagents", "langchain_core", "langchain", "langgraph"]
