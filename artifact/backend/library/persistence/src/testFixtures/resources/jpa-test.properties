# The JPA settings of the adapter tests: the same as the "Persistence (JPA)" block in the application's
# application.properties, which Spring Boot reads from the application only. Keep them in sync; the
# application's own Spring Boot tests run on the real file, so a drift shows up there.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
