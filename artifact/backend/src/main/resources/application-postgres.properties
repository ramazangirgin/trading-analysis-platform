# PostgreSQL instead of the SQLite file: activate with SPRING_PROFILES_ACTIVE=postgres (the Docker
# Compose setup does). The schema is the same; migrations in db/migration-postgresql adapt the
# column types SQLite does not distinguish.
spring.datasource.url=jdbc:postgresql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:5432}/${PLATFORM_DB_NAME:platform}
spring.datasource.username=${PLATFORM_DB_USER:platform}
spring.datasource.password=${PLATFORM_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.locations=classpath:db/migration,classpath:db/migration-postgresql
