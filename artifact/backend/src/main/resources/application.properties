spring.application.name=trading-analysis-platform

# Localhost only by default. Exposing it beyond localhost goes through the Caddy overlay
# (deploy/docker-compose.public.yml), which serves HTTPS and forwards to the platform.
server.address=127.0.0.1
server.port=8080
# Behind a reverse proxy: Tomcat's RemoteIpValve takes X-Forwarded-For and X-Forwarded-Proto only from an
# internal proxy address (its default internal-proxies: 10/8, 172.16/12, 192.168/16, 169.254/16, 127/8 and the
# IPv6 local ranges, which include the Compose network). So behind Caddy getRemoteAddr() is the client and
# isSecure() is true over HTTPS (Secure session and CSRF cookies); from any other address the headers are ignored.
server.forward-headers-strategy=native

# Virtual threads for SSE streams and runner process I/O.
spring.threads.virtual.enabled=true

# Keep the OpenAPI spec under /api; the frontend TS client is generated from it.
springdoc.api-docs.path=/api/openapi
# Mappings do not declare produces = application/json (TAP-D5); without this springdoc would list */*.
springdoc.default-produces-media-type=application/json

management.endpoints.web.exposure.include=health,info,metrics

# --- Login (#78) ---------------------------------------------------------------------
# The first admin, created on the first start when no user exists (#82). Without a password one is
# generated, printed to the log once, and the account must change it. Ignored once any user exists.
platform.admin.username=${PLATFORM_ADMIN_USERNAME:admin}
platform.admin.password=${PLATFORM_ADMIN_PASSWORD:}
# Password policy (#84): the minimum length of a password, 8 to 64. Startup fails outside that range.
platform.password.min-length=${PLATFORM_PASSWORD_MIN_LENGTH:12}
# Lockout (#85): after this many wrong passwords in a row an account is locked for the duration.
platform.login.max-failed-attempts=${PLATFORM_LOGIN_MAX_FAILED_ATTEMPTS:5}
platform.login.lockout-duration=${PLATFORM_LOGIN_LOCKOUT_DURATION:15m}
# Per client address: this many failed logins within the window, then 429 until the window frees up.
platform.login.ip-max-failed-attempts=${PLATFORM_LOGIN_IP_MAX_FAILED_ATTEMPTS:20}
platform.login.ip-window=${PLATFORM_LOGIN_IP_WINDOW:5m}
# What a visitor reads of a partial analysis (#194): the report sections in full (comma separated, e.g.
# market_report,news_report), and the characters of the first one shown on a list card, 1 to 5000.
platform.analysis.preview.sections=${PLATFORM_ANALYSIS_PREVIEW_SECTIONS:market_report}
platform.analysis.preview.excerpt-length=${PLATFORM_ANALYSIS_PREVIEW_EXCERPT_LENGTH:400}
# Sessions live in the server's memory: a restart logs everyone out. Idle timeout, configurable.
server.servlet.session.timeout=${PLATFORM_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# The login is checked by the identity domain, not by a UserDetailsService: without this Boot would
# create an in-memory user and log its password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- Platform state: run directories and the database ---------------------------------
# Kept apart from the TradingAgents data dir (platform.data-dir), which upstream owns.
platform.home=${PLATFORM_HOME:${user.home}/.tradingagents-platform}
platform.data-dir=${TRADINGAGENTS_HOME:${user.home}/.tradingagents}
# Upstream's results directory; honours upstream's own override so both read the same place.
platform.results-dir=${TRADINGAGENTS_RESULTS_DIR:${platform.data-dir}/logs}
# Upstream's price cache (yfinance CSVs), read for the price chart; same override as upstream.
platform.cache-dir=${TRADINGAGENTS_CACHE_DIR:${platform.data-dir}/cache}

# PostgreSQL 18: `mise run run` / `mise run dev` start a local container, Docker Compose has its own.
spring.datasource.url=jdbc:postgresql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:5432}/${PLATFORM_DB_NAME:platform}
spring.datasource.username=${PLATFORM_DB_USER:platform}
spring.datasource.password=${PLATFORM_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
# Flyway is configured by each domain, not here: its <Domain>PersistenceConfiguration declares the
# domain's Flyway bean (schema, history table, migration location). Boot's own Flyway backs off.

# --- Persistence (JPA) ---------------------------------------------------------------
# Flyway owns the schema: Hibernate never creates or alters a table, and an entity that does not
# match its migration fails at startup.
spring.jpa.hibernate.ddl-auto=validate
# No session kept open for the web request: repositories load what they need inside their transaction.
spring.jpa.open-in-view=false
# No SQL in the log.
spring.jpa.show-sql=false
# Names reach PostgreSQL as written in @Table / @Column (uppercase) and quoted. Boot's default naming
# strategy would lower-case every name. Keep these two lines in sync with jpa-test.properties of
# :backend:library:persistence, which the adapter tests load.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# --- Analysis runs -------------------------------------------------------------------
platform.analysis.max-concurrent-runs=2
# Local process runner. Paths are relative to the working
# directory, which is the repository root for both bootRun and `java -jar` from the root.
platform.runner.process.command=artifact/ta-runner/.venv/bin/python,-m,ta_runner
platform.runner.process.working-dir=artifact/ta-runner
platform.runner.stop-grace-seconds=15
# Which runner starts analyses: "process" (the venv above) or "docker" (one ta-runner container
# per analysis; what the Docker Compose setup uses).
platform.runner=${PLATFORM_RUNNER:process}
# Docker runner: the Engine API (a Docker or Podman socket, or docker-socket-proxy over tcp://),
# the runner image (only this one is ever started), and where the TradingAgents data dir comes
# from: a volume name, or an absolute path on the Docker host. Limits apply per analysis.
platform.runner.docker.host=${DOCKER_HOST:unix:///var/run/docker.sock}
platform.runner.docker.image=${TA_RUNNER_IMAGE:ta-runner:latest}
platform.runner.docker.data-mount=${TA_RUNNER_DATA_MOUNT:tradingagents-data}
platform.runner.docker.network=${TA_RUNNER_NETWORK:}
platform.runner.docker.memory-mb=2048
platform.runner.docker.cpus=2
# Provider API keys handed to the runner as environment variables. The platform writes only its
# own file (Settings page, owner-only permissions); the external files are read-only and lose to it.
platform.secrets.env-file=${platform.home}/secrets.env
platform.secrets.external-env-files=artifact/ta-runner/.env
