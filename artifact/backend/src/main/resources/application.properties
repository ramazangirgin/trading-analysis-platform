spring.application.name=trading-analysis-platform

# Localhost only by default. Exposing it beyond localhost requires auth + HTTPS, which the platform does not have yet.
server.address=127.0.0.1
server.port=8080

# Virtual threads for SSE streams and runner process I/O.
spring.threads.virtual.enabled=true

# Keep the OpenAPI spec under /api; the frontend TS client is generated from it.
springdoc.api-docs.path=/api/openapi

management.endpoints.web.exposure.include=health,info,metrics

# --- Platform state: run directories and the database ---------------------------------
# Kept apart from the TradingAgents data dir (platform.data-dir), which upstream owns.
platform.home=${PLATFORM_HOME:${user.home}/.tradingagents-platform}
platform.data-dir=${TRADINGAGENTS_HOME:${user.home}/.tradingagents}
# Upstream's results directory; honours upstream's own override so both read the same place.
platform.results-dir=${TRADINGAGENTS_RESULTS_DIR:${platform.data-dir}/logs}
# Upstream's price cache (yfinance CSVs), read for the price chart; same override as upstream.
platform.cache-dir=${TRADINGAGENTS_CACHE_DIR:${platform.data-dir}/cache}

# PostgreSQL 18: `mise run run` / `mise run dev` start a local container, Docker Compose has its own.
spring.datasource.url=jdbc:postgresql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:5432}/${PLATFORM_DB_NAME:platform}
spring.datasource.username=${PLATFORM_DB_USER:platform}
spring.datasource.password=${PLATFORM_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
# Flyway's history table is uppercase like every other database object (Flyway quotes the name).
spring.flyway.table=FLYWAY_SCHEMA_HISTORY

# --- Persistence (JPA) ---------------------------------------------------------------
# Flyway owns the schema: Hibernate never creates or alters a table, and an entity that does not
# match its migration fails at startup.
spring.jpa.hibernate.ddl-auto=validate
# No session kept open for the web request: repositories load what they need inside their transaction.
spring.jpa.open-in-view=false
# No SQL in the log.
spring.jpa.show-sql=false
# Names reach PostgreSQL as written in @Table / @Column (uppercase) and quoted. Boot's default naming
# strategy would lower-case every name. Keep these two lines in sync with jpa-test.properties of
# :backend:library:persistence, which the adapter tests load.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# --- Analysis runs -------------------------------------------------------------------
platform.analysis.max-concurrent-runs=2
# Local process runner. Paths are relative to the working
# directory, which is the repository root for both bootRun and `java -jar` from the root.
platform.runner.process.command=artifact/ta-runner/.venv/bin/python,-m,ta_runner
platform.runner.process.working-dir=artifact/ta-runner
platform.runner.stop-grace-seconds=15
# Which runner starts analyses: "process" (the venv above) or "docker" (one ta-runner container
# per analysis; what the Docker Compose setup uses).
platform.runner=${PLATFORM_RUNNER:process}
# Docker runner: the Engine API (a Docker or Podman socket, or docker-socket-proxy over tcp://),
# the runner image (only this one is ever started), and where the TradingAgents data dir comes
# from: a volume name, or an absolute path on the Docker host. Limits apply per analysis.
platform.runner.docker.host=${DOCKER_HOST:unix:///var/run/docker.sock}
platform.runner.docker.image=${TA_RUNNER_IMAGE:ta-runner:latest}
platform.runner.docker.data-mount=${TA_RUNNER_DATA_MOUNT:tradingagents-data}
platform.runner.docker.network=${TA_RUNNER_NETWORK:}
platform.runner.docker.memory-mb=2048
platform.runner.docker.cpus=2
# Provider API keys handed to the runner as environment variables. The platform writes only its
# own file (Settings page, owner-only permissions); the external files are read-only and lose to it.
platform.secrets.env-file=${platform.home}/secrets.env
platform.secrets.external-env-files=artifact/ta-runner/.env
