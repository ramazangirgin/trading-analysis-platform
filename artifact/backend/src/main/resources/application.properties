spring.application.name=trading-analysis-platform

# Localhost only by default. Exposing it beyond localhost requires auth + HTTPS (PLAN.md section 7).
server.address=127.0.0.1
server.port=8080

# Virtual threads for SSE streams and runner process I/O.
spring.threads.virtual.enabled=true

# Keep the OpenAPI spec under /api; the frontend TS client is generated from it.
springdoc.api-docs.path=/api/openapi

management.endpoints.web.exposure.include=health,metrics

# --- Platform state: database and run directories ---------------------------------
# Kept apart from the TradingAgents data dir (platform.data-dir), which upstream owns.
platform.home=${PLATFORM_HOME:${user.home}/.tradingagents-platform}
platform.data-dir=${TRADINGAGENTS_HOME:${user.home}/.tradingagents}
# Upstream's results directory; honours upstream's own override so both read the same place.
platform.results-dir=${TRADINGAGENTS_RESULTS_DIR:${platform.data-dir}/logs}
# Upstream's price cache (yfinance CSVs), read for the price chart; same override as upstream.
platform.cache-dir=${TRADINGAGENTS_CACHE_DIR:${platform.data-dir}/cache}

spring.datasource.url=jdbc:sqlite:${platform.home}/platform.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
spring.datasource.hikari.maximum-pool-size=4

# --- Analysis runs -------------------------------------------------------------------
platform.analysis.max-concurrent-runs=2
# Local process runner (PLAN.md section 4, option A). Paths are relative to the working
# directory, which is the repository root for both bootRun and `java -jar` from the root.
platform.runner.process.command=artifact/ta-runner/.venv/bin/python,-m,ta_runner
platform.runner.process.working-dir=artifact/ta-runner
platform.runner.stop-grace-seconds=15
# Provider API keys handed to the runner as environment variables. The platform writes only its
# own file (Settings page, owner-only permissions); the external files are read-only and lose to it.
platform.secrets.env-file=${platform.home}/secrets.env
platform.secrets.external-env-files=artifact/ta-runner/.env
