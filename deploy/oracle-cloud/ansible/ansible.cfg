[defaults]
# Written by Terraform (terraform/inventory.tf) when `mise run oracle:up` has applied.
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
# accept-new: the VM's host key is trusted on the first connection and checked after that.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
