- name: Add Tailscale's apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    state: present
  register: tailscale_repository

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: "{{ tailscale_repository is changed }}"

- name: Start tailscaled at boot
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

- name: Read the Tailscale login state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Find out whether this node is logged in
  ansible.builtin.set_fact:
    tailscale_logged_in: "{{ (tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('') == 'Running' }}"

- name: Check that the auth key is set
  ansible.builtin.assert:
    that: lookup('env', 'TAILSCALE_AUTHKEY') | length > 0
    quiet: true
    fail_msg: >-
      This node is not logged in to Tailscale, and TAILSCALE_AUTHKEY is not set. Create an auth key
      in the Tailscale admin console and run `export TAILSCALE_AUTHKEY=tskey-auth-...` first
      (deploy/oracle-cloud/ansible/.env.example).
  when: not tailscale_logged_in

- name: Log in to Tailscale
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--auth-key={{ lookup('env', 'TAILSCALE_AUTHKEY') }}"
      - "--hostname={{ tailscale_hostname }}"
  when: not tailscale_logged_in
  changed_when: true
  no_log: true

- name: Read the tailscale serve configuration
  ansible.builtin.command: tailscale serve status --json
  register: tailscale_serve_status
  changed_when: false
  check_mode: false

- name: Serve the platform on the tailnet over HTTPS
  ansible.builtin.command:
    argv:
      - tailscale
      - serve
      - --bg
      - --https=443
      - "http://127.0.0.1:{{ platform_port }}"
  when: tailscale_serve_status.stdout is not search('http://127\.0\.0\.1:' ~ platform_port ~ '/?"')
  changed_when: true
