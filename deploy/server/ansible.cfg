[defaults]
# Your copy of inventory.ini.example; another one with `mise run server:deploy -- -i <file>`.
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
# accept-new: the server's host key is trusted on the first connection and checked after that.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
