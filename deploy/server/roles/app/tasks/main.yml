- name: Add mise's apt repository
  ansible.builtin.deb822_repository:
    name: mise
    types: deb
    uris: https://mise.jdx.dev/deb
    suites: stable
    components: main
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: https://mise.jdx.dev/gpg-key.pub
    state: present
  register: app_mise_repository

- name: Install mise
  ansible.builtin.apt:
    name: mise
    state: present
    update_cache: "{{ app_mise_repository is changed }}"

- name: Create the application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ platform_data }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Check out the repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_ref }}"
    force: true
  become: true
  become_user: "{{ app_user }}"
  register: app_checkout

- name: Create the directory of the generated secrets
  ansible.builtin.file:
    path: /etc/trading-analysis-platform
    state: directory
    owner: root
    group: root
    mode: "0700"

# Made once, on the server, and never copied off it.
- name: Generate the database password
  ansible.builtin.command: openssl rand -hex -out /etc/trading-analysis-platform/postgres-password 32
  args:
    creates: /etc/trading-analysis-platform/postgres-password
  register: app_postgres_password_file

- name: Restrict the database password file to root
  ansible.builtin.file:
    path: /etc/trading-analysis-platform/postgres-password
    owner: root
    group: root
    mode: "0600"

- name: Read the database password
  ansible.builtin.slurp:
    src: /etc/trading-analysis-platform/postgres-password
  register: app_postgres_password_content
  no_log: true

- name: Write the Compose environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/deploy/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  vars:
    app_postgres_password: "{{ app_postgres_password_content.content | b64decode | trim }}"
  no_log: true

- name: Look for the images
  ansible.builtin.command: docker image inspect {{ item }}
  loop:
    - "{{ app_platform_image }}"
    - "{{ app_runner_image }}"
  become: true
  become_user: "{{ app_user }}"
  environment: "{{ app_user_environment }}"
  register: app_images
  changed_when: false
  failed_when: false
  check_mode: false

# The commit of the last successful build: a rerun after a failed build must build again, even though
# the checkout no longer changes and the images of the previous version still exist.
- name: Read the commit the images were built from
  ansible.builtin.command: cat /etc/trading-analysis-platform/built-commit
  register: app_built_commit
  changed_when: false
  failed_when: false
  check_mode: false

- name: Find out whether the images must be built
  ansible.builtin.set_fact:
    app_build_needed: >-
      {{ app_built_commit.rc != 0
      or app_built_commit.stdout | trim != app_checkout.after
      or (app_images.results | selectattr('rc', 'ne', 0) | list | length > 0) }}

- name: Trust the mise configuration of the checkout
  ansible.builtin.command: mise trust
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ app_user }}"
  environment: "{{ app_user_environment }}"
  when: app_build_needed
  changed_when: true

- name: Install the JDK of the checkout
  ansible.builtin.command: mise install java
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ app_user }}"
  environment: "{{ app_user_environment }}"
  when: app_build_needed
  changed_when: true

# The first build takes a while on the server; async keeps the SSH connection from timing out.
- name: Build the images
  ansible.builtin.command: mise run docker-build
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ app_user }}"
  environment: "{{ app_user_environment }}"
  async: 3600
  poll: 15
  when: app_build_needed
  changed_when: true

- name: Record the commit the images were built from
  ansible.builtin.copy:
    content: "{{ app_checkout.after }}\n"
    dest: /etc/trading-analysis-platform/built-commit
    owner: root
    group: root
    mode: "0644"
  when: app_build_needed

# init-dirs runs to completion at every `up`; only the other containers count as a change.
- name: Start the Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/deploy"
    files: "{{ ['docker-compose.yml'] + (['docker-compose.public.yml'] if public_domain | length > 0 else []) }}"
    state: present
  register: app_compose
  changed_when: app_compose.actions | rejectattr('id', 'search', 'init-dirs') | list | length > 0

- name: Wait for the platform to be healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ platform_port }}/actuator/health"
    return_content: true
  register: app_health
  until: (app_health.json | default({})).status | default('') == 'UP'
  retries: 30
  delay: 10
  changed_when: false

# On the server: Caddy does not serve /actuator/info, only 127.0.0.1:8080 does.
- name: Check the version the platform reports
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ platform_port }}/actuator/info"
    return_content: true
  register: app_info
  changed_when: false
  when: app_ref is match('^v[0-9]+\.[0-9]+\.[0-9]+$')

- name: Fail when the platform reports another version than the tag
  ansible.builtin.assert:
    that: app_reported_version == app_ref[1:]
    fail_msg: "The platform reports version '{{ app_reported_version }}', the tag {{ app_ref }} is '{{ app_ref[1:] }}'."
    quiet: true
  vars:
    app_reported_version: "{{ ((app_info.json | default({})).build | default({})).version | default('none') }}"
  when: app_ref is match('^v[0-9]+\.[0-9]+\.[0-9]+$')

# From this machine, not the server: it proves DNS, the provider's firewall, the server's firewall
# and the certificate, which the first request makes Caddy get (a few minutes at most).
- name: Check the platform over HTTPS
  when: public_domain | length > 0
  block:
    - name: Wait for the platform to answer over HTTPS
      ansible.builtin.uri:
        url: "https://{{ public_domain }}/actuator/health"
        return_content: true
      register: app_public_health
      until: (app_public_health.json | default({})).status | default('') == 'UP'
      retries: 30
      delay: 10
      changed_when: false
      delegate_to: localhost
      become: false
  rescue:
    - name: Explain why the platform does not answer over HTTPS
      ansible.builtin.fail:
        msg: >-
          https://{{ public_domain }}/actuator/health does not answer from this machine. Check that
          the DNS record of {{ public_domain }} points at the server, that the provider's firewall
          lets TCP 80 and 443 in (and UDP 443), that the server's firewall does (sudo ufw status;
          on Oracle Cloud also sudo iptables -L INPUT -n), and that Caddy got a certificate
          (sudo -u {{ app_user }} docker compose -f {{ app_dir }}/deploy/docker-compose.yml
          -f {{ app_dir }}/deploy/docker-compose.public.yml logs caddy).

# The UI listens on the server's 127.0.0.1 only (an SSH tunnel brings it to this machine), and on the
# public domain when there is one.
- name: Show how to open the platform
  ansible.builtin.debug:
    msg: "{{ app_lines | select | list }}"
  vars:
    app_lines:
      - "{{ ('The platform runs on https://' ~ public_domain) if public_domain | length > 0 else '' }}"
      - "{{ 'It can also be opened through an SSH tunnel, kept open while you use it:' if public_domain | length > 0
        else 'The platform runs. Open it through an SSH tunnel, kept open while you use it:' }}"
      - "  mise run server:tunnel{{ '' if platform_port | int == 8080 else ' -- --remote-port ' ~ platform_port }}"
      - "  (or: ssh {{ app_ssh_key }}{{ app_ssh_port }}-N -L {{ platform_port }}:127.0.0.1:{{ platform_port }} {{ app_ssh_target }})"
      - "then http://127.0.0.1:{{ platform_port }}"
      - "{{ app_password_hint }}"
      - "  sudo -u {{ app_user }} docker compose -f {{ app_dir }}/deploy/docker-compose.yml logs platform"
    app_ssh_key: "{{ '-i ' ~ ansible_ssh_private_key_file ~ ' ' if ansible_ssh_private_key_file is defined else '' }}"
    app_ssh_port: "{{ '-p ' ~ ansible_port ~ ' ' if ansible_port is defined else '' }}"
    app_ssh_target: "{{ (ansible_user ~ '@') if ansible_user is defined else '' }}{{ ansible_host | default(inventory_hostname) }}"
    app_password_hint: >-
      {{ 'First start: the generated admin password is printed once in the log of the platform (on the server):'
      if app_postgres_password_file is changed
      else 'The admin password generated on the first start is in the log of the platform only until
      the container is recreated (an upgrade, a rebuilt image or a changed .env) or the log rotates;
      if it is gone, see "Log in" in the main README to reset the admin. The log (on the server):' }}
