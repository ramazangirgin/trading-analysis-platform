# Sets up the server in the inventory and deploys the Docker Compose setup (deploy/docker-compose.yml)
# on it. Run it with `mise run server:deploy`; running it again changes nothing when nothing
# changed. The defaults are in group_vars/all.yml.
- name: Deploy the Trading Analysis Platform
  hosts: server
  become: true
  # Gathered below, once Ansible's temporary folder exists.
  gather_facts: false
  pre_tasks:
    # A module that finds no ~/.ansible/tmp creates it and warns ("did not exist and was created
    # with a mode of 0700"); raw runs no module, so it can make the folder first.
    - name: Create the folder of Ansible's temporary files
      ansible.builtin.raw: install -d -m 700 ~/.ansible/tmp
      changed_when: false

    - name: Gather the facts about the server
      ansible.builtin.setup:

    - name: Check that a public domain comes with an e-mail address
      ansible.builtin.assert:
        that: public_domain | length == 0 or acme_email | length > 0
        fail_msg: "public_domain is set ({{ public_domain }}), so acme_email is required: -e acme_email=<mail>"
        quiet: true
  roles:
    - base
    - docker
    - app
    - backup
