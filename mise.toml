# Developer entry points and the tools they need. `mise install` fetches the tools below into mise's
# own directory (nothing system-wide); `mise run <task>` runs a task with them on PATH and
# JAVA_HOME set. `mise tasks` lists the tasks.
#
# One JDK serves everything: Gradle runs on it, the backend's Java 25 toolchain finds it, and the
# jar runs on it. Node.js and pnpm are still downloaded by the build; uv downloads Python 3.12.

[tools]
java = "temurin-25"
uv = "0.12"
# Git hooks (lefthook.yml): `mise run hooks` installs them.
lefthook = "2.1"
# Deployment to a server over SSH (deploy/server/): Ansible sets it up. It serves deploy/server/
# only; nothing else in the repository needs it.
# ansible-core's commands (ansible-playbook) and ansible-lint, each in a tool environment that also
# has the full `ansible` package (14.x), so the collections the roles use (community.general,
# community.docker, ansible.posix) are there; its major pins ansible-core's minor.
# Renovate does not read uvx_args: a custom manager in .github/renovate.json5 updates the `ansible~=`
# range, and ansible-core is bumped by hand along with it.
# --no-build-package cryptography: take the newest cryptography with a ready-made wheel for this
# machine instead of compiling one (which needs Rust and OpenSSL's headers). From 49.0 on there are
# no wheels for Intel Macs, so they get 48.0.1; Linux and Apple Silicon get the newest.
"pipx:ansible-core" = { version = "2.21", uvx_args = "--with ansible~=14.4 --no-build-package cryptography" }
"pipx:ansible-lint" = { version = "26.9.0", uvx_args = "--with ansible~=14.4 --no-build-package cryptography" }

[env]
# Claude Code loads the agent-progress mod (status line, toasts, pane) in sessions started from this
# folder or a worktree of it, without `--plugin-dir`.
CLAUDE_CODE_PLUGIN_DIRS = "{{config_root}}/.claude/mods/agent-progress"
# Testcontainers and the Docker client find Podman's socket on macOS (scripts/container-env.sh).
_.source = "{{config_root}}/scripts/container-env.sh"

[tasks.setup]
description = "Install ta-runner (TradingAgents + deps), the frontend's packages, the Git hooks, and a container engine when there is none (Docker on Ubuntu/Debian, Podman on macOS; PLATFORM_INSTALL_ENGINE=0 skips it)"
run = [
  "cd artifact/ta-runner && uv sync",
  "./gradlew :frontend:pnpmInstall",
  { task = "hooks" },
  { task = "container-engine" },
]

# Docker or Podman, which run, dev, the backend tests, the images and the end-to-end tests need. An
# engine that works is left alone (scripts/container-engine.sh).
[tasks.container-engine]
description = "Check the container engine (Docker or Podman) and install one when there is none: Docker on Ubuntu/Debian (sudo apt-get), Podman on macOS (Homebrew)"
run = "scripts/container-engine.sh"

[tasks.hooks]
description = "Install the Git hooks (lefthook.yml): lint and import checks on staged files before a commit"
run = "lefthook install"

# The platform's PostgreSQL 18 (scripts/postgres.sh): a local container, in Docker or Podman, that
# run and dev start on their own. PLATFORM_DB_HOST (and _PORT, _NAME, _USER, _PASSWORD) point the
# platform at your own server instead, and then no container is started; for a server on localhost
# also set PLATFORM_DB_CONTAINER=false.
[tasks.db]
description = "Start the local PostgreSQL for run and dev (Docker or Podman), unless PLATFORM_DB_CONTAINER=false or PLATFORM_DB_HOST points elsewhere"
run = "scripts/postgres.sh start"

[tasks."db:stop"]
description = "Stop the local PostgreSQL container; its data stays in the volume trading-analysis-platform-db"
run = "scripts/postgres.sh stop"

[tasks."db:reset"]
description = "Remove the local PostgreSQL container and its volume: the next start is an empty database"
run = "scripts/postgres.sh reset"

[tasks.dev]
description = "Backend on :8080 and Vite (hot reload) on :5173, together; open http://localhost:5173. Starts the local PostgreSQL (mise run db)"
depends = ["db"]
run = "./gradlew --parallel --console=plain :backend:bootRun :frontend:pnpmDev"

[tasks.build]
description = "Test everything and build the single jar (backend + UI); the backend tests need Docker or Podman"
run = "./gradlew build"

[tasks.runner-test]
description = "ta-runner lint, import contracts, dependency check (deptry) and tests"
# scripts/quiet.sh: one line per command when AGENT_QUIET=1 (set for the agents), unchanged otherwise.
run = [
  "scripts/quiet.sh runner-test-ruff sh -c 'cd artifact/ta-runner && uv run ruff check .'",
  "scripts/quiet.sh runner-test-imports sh -c 'cd artifact/ta-runner && uv run lint-imports'",
  "scripts/quiet.sh runner-test-deptry sh -c 'cd artifact/ta-runner && uv run deptry .'",
  "scripts/quiet.sh runner-test-pytest sh -c 'cd artifact/ta-runner && uv run pytest -q'",
]

# Gradle through the quiet wrapper: mise run gradle :backend:test --tests '*FooTest'
[tasks.gradle]
description = "Run Gradle (./gradlew --console=plain) with the arguments given: mise run gradle <tasks>; inside an agent (AGENT_QUIET=1) it prints one line, the output goes to build/quiet/gradle.log"
run = "scripts/quiet.sh gradle ./gradlew --console=plain"

[tasks.e2e]
description = "End-to-end tests (e2e/, Playwright): the built jar on a throwaway PostgreSQL container (Docker or Podman) with ta-runner replaying a recording, in a real browser"
# Runs in the installed Google Chrome; E2E_BROWSER_CHANNEL picks another browser channel.
run = [
  "./gradlew --console=plain :backend:bootJar",
  "cd artifact/ta-runner && uv sync",
  "e2e/with-node.sh pnpm install --frozen-lockfile",
  "e2e/with-node.sh pnpm test",
]

[tasks.screenshots]
description = "Take the docs' screenshots (e2e/screenshots/*.shot.ts) into docs/screenshots/: mise run screenshots [name filter]; needs Docker or Podman"
# Like the end-to-end tests: the built jar on a throwaway PostgreSQL container with ta-runner
# replaying a recording, in Google Chrome.
run = [
  "mkdir -p build && touch build/screenshots.stamp",
  "./gradlew --console=plain :backend:bootJar",
  "cd artifact/ta-runner && uv sync",
  "e2e/with-node.sh pnpm install --frozen-lockfile",
  "e2e/with-node.sh pnpm run screenshots",
  "uv run --no-project python scripts/agent/screenshot_report.py build/screenshots.stamp ${SCREENSHOT_DIR:-docs/screenshots}",
]

[tasks.check]
description = "Quick check before pushing: package structure (ArchUnit, ESLint, import-linter), lint (Checkstyle, ESLint, ruff), formatting (Spotless, Prettier), type-check, dependency declarations (Gradle analysis, Knip, deptry), a conventions test in every domain with persistence, the custom Checkstyle checks' own tests, the agent scripts' and the Claude Code skills' Python tests; no other tests"
run = [
  "scripts/quiet.sh check-gradle ./gradlew --console=plain spotlessCheck checkstyleRulesCheck checkstyleMain checkstyleTest :backend:test --tests '*ArchitectureTest' :backend:domainPersistenceTestsCheck :frontend:pnpmLint :frontend:pnpmDepsCheck analyzeDependencies",
  "scripts/quiet.sh check-frontend-types artifact/frontend/with-node.sh pnpm run type-check",
  "scripts/quiet.sh check-e2e-types e2e/with-node.sh pnpm run type-check",
  "scripts/quiet.sh check-runner sh -c 'cd artifact/ta-runner && uv run ruff check . && uv run lint-imports && uv run deptry .'",
  { task = "agent:test" },
  { task = "skill:test" },
]

# Formatting of every file: Java (Spotless, Palantir Java Format), the frontend and e2e/ (Prettier).
# ta-runner has no formatter yet.
[tasks.format]
description = "Format every Java (Spotless) and frontend (Prettier) file"
run = [
  "scripts/quiet.sh format-gradle ./gradlew --console=plain spotlessApply :frontend:pnpmInstall",
  "scripts/quiet.sh format-frontend artifact/frontend/with-node.sh pnpm exec prettier --write .",
  "scripts/quiet.sh format-e2e e2e/with-node.sh sh -c 'pnpm install --frozen-lockfile && pnpm run format'",
]

[tasks.format-check]
description = "Check the formatting of every Java (Spotless) and frontend (Prettier) file, as CI does"
run = [
  "scripts/quiet.sh format-check-gradle ./gradlew --console=plain spotlessCheck :frontend:pnpmInstall",
  "scripts/quiet.sh format-check-frontend artifact/frontend/with-node.sh pnpm exec prettier --check .",
  "scripts/quiet.sh format-check-e2e e2e/with-node.sh sh -c 'pnpm install --frozen-lockfile && pnpm run format-check'",
]

[tasks.test]
description = "All tests: backend (needs Docker or Podman), frontend, ta-runner"
depends = ["build", "runner-test"]

[tasks.run]
description = "Build the single jar (UI included) if anything changed and run it on http://127.0.0.1:8080, on the local PostgreSQL (mise run db)"
depends = ["db"]
# bootJar is up to date in seconds when nothing changed, and rebuilds after a git pull.
run = [
  "./gradlew --console=plain :backend:bootJar",
  "java -jar artifact/backend/build/libs/platform.jar",
]

[tasks.api-types]
description = "Refresh openapi.json and the frontend's API types from the running backend (start mise run dev first)"
run = [
  "curl -fsS http://localhost:8080/api/openapi | uv run --no-project python -m json.tool --indent 4 --no-ensure-ascii > artifact/frontend/openapi.json",
  "./gradlew --console=plain :frontend:pnpmApiTypes",
]

[tasks."docker-build:platform"]
description = "Build the platform Docker image (backend + UI jar, see deploy/)"
run = [
  "./gradlew --console=plain :backend:bootJar",
  "v=$(scripts/version.sh) && docker build -f deploy/Dockerfile --build-arg VERSION=$v -t trading-analysis-platform:$v -t trading-analysis-platform:latest .",
]

[tasks."docker-build:runner"]
description = "Build the ta-runner Docker image (see deploy/)"
run = "v=$(scripts/version.sh) && docker build --build-arg VERSION=$v -t ta-runner:$v -t ta-runner:latest artifact/ta-runner"

[tasks.docker-build]
description = "Build the Docker images: the platform (backend + UI jar) and ta-runner (see deploy/)"
# One after the other: both are bound by writing image layers, and building them side by side only
# makes them compete for the disk (slow inside Podman's VM on macOS). The server deploy builds them
# side by side, since the ta-runner image needs neither the jar nor the platform image.
# Tagged with the version and latest; the Compose setup uses latest unless deploy/.env says otherwise.
run = [
  { task = "docker-build:platform" },
  { task = "docker-build:runner" },
]

# One version for the whole repository (docs/coding-convention/repository-versioning-and-releases.md): every
# pull request into main raises it (Renovate's update pull requests excepted), and merging it
# releases vX.Y.Z.
[tasks.version]
description = "Print the platform version (gradle.properties)"
run = "scripts/version.sh"

[tasks."version:bump"]
description = "Raise the version in gradle.properties, package.json and ta-runner: mise run version:bump major|minor|patch"
run = "scripts/version.sh bump"

# Agentic development (docs/agentic-development.md): issue → plan →
# agent implementation → agent review → pull request, on this machine with Claude Code and your own
# Claude Code login. Planning is the plan-from-issue Claude Code skill.
[tasks."agent:plan-branch"]
description = "Push a plan on its own branch and open its draft PR labelled plan: mise run agent:plan-branch .plans/<issue>-<slug>.md"
run = "scripts/agent/plan-branch.sh"

[tasks."agent:plan-comments"]
description = "Unanswered comments on a plan PR, or answer them: mise run agent:plan-comments <pr | plan/<issue>-<slug>> | --reply <comment id> <file> | --comment <pr | branch> <file> <id>... | --approve <pr | branch> | --approved <pr | branch>"
run = "scripts/agent/plan-comments.sh"

[tasks."agent:run"]
description = "Agents take an approved plan (its draft PR labelled plan carries on) to a PR ready for review: mise run agent:run plan/<issue>-<slug>"
run = "scripts/agent/run.sh"

[tasks."agent:implement"]
description = "Only the implementation, on the plan's draft PR or a new one: mise run agent:implement plan/<issue>-<slug>"
run = "scripts/agent/implement.sh"

[tasks."agent:next"]
description = "Continue the review → fix loop of an agent PR to its end: mise run agent:next plan/<issue>-<slug>"
run = "scripts/agent/next.sh"

[tasks."agent:update-main"]
description = "Merge main into an agent PR's branch (version-only conflicts by script, others by an agent), bump the version, push: mise run agent:update-main <pr | plan/<issue>-<slug>> [--bump major|minor|patch]"
run = "scripts/agent/update-main.sh"

[tasks."agent:detach"]
description = "Start an agent script detached from the terminal, its output in the plan branch's run.log: mise run agent:detach <script> plan/<issue>-<slug> (or a PR number)"
run = "scripts/agent/detach.sh"

[tasks."agent:status"]
description = "Where an agent run is: active pid, work package, latest milestones and log lines: mise run agent:status plan/<issue>-<slug> (or a PR number)"
run = "scripts/agent/status.sh"

[tasks."agent:progress"]
description = "Print the progress comment of an agent run (steps, durations, iterations, tokens), as it is on the issue: mise run agent:progress plan/<issue>-<slug> (or a PR number)"
run = "scripts/agent/progress.sh show"

[tasks."agent:dashboard"]
description = "Print the body of the Agent Dashboard issue (a step graph per active agent process), or rebuild it on GitHub: mise run agent:dashboard [--post]"
run = "scripts/agent/dashboard.sh"

[tasks."agent:stats"]
description = "Turns, tokens, tool calls and tool output of an issue's agent transcripts, as Markdown: mise run agent:stats <issue> [--transcript FILE --since EPOCH --until EPOCH] [--json]"
run = "uv run --no-project python scripts/agent/transcript_stats.py"

[tasks."agent:lsp-check"]
description = "Does a headless agent get the LSP tool from scripts/agent/lsp/, and how long does each language server take to its first answer; --twice repeats the Java check for the warm jdtls start: mise run agent:lsp-check [--twice]"
run = "bash scripts/agent/lsp-check.sh"

[tasks."agent:test"]
description = "Python tests of the agent scripts (scripts/agent/test_*.py): the plan parser, the plan comments, the usage figures, the progress comment and the dashboard"
run = "scripts/quiet.sh agent-test uv run --no-project python -m unittest discover -s scripts/agent -p 'test_*.py'"

[tasks."skill:test"]
description = "Python tests of the Claude Code skills' helpers (.claude/skills/dependabot-fix/test_*.py)"
run = "scripts/quiet.sh skill-test uv run --no-project python -m unittest discover -s .claude/skills/dependabot-fix -p 'test_*.py'"

[tasks."ci:test-changes"]
description = "Test scripts/ci-changes.sh, which decides the CI jobs a change needs, against a throwaway Git repository"
run = "bash scripts/test-ci-changes.sh"

[tasks."github:setup"]
description = "Set up the repository on GitHub (settings, ruleset main, labels, the production environment of Deploy) with gh, as an admin; safe to run again (docs/ci-and-releases.md)"
run = "scripts/github-setup.sh"

# Deployment to a server over SSH (deploy/server/README.md): Ansible sets the server up and deploys
# the Compose setup on it. server:deploy needs deploy/server/inventory.ini; server:check needs nothing.
[tasks."server:deploy"]
description = "Set up the server in deploy/server/inventory.ini over SSH and deploy the Compose setup on it (Ansible, run from this machine; the build happens on the server): mise run server:deploy [-- -e app_ref=v1.2.3]"
run = "deploy/server/deploy.sh"

[tasks."server:tunnel"]
description = "Open the deployed platform's UI from this machine: an SSH tunnel to the server in deploy/server/inventory.ini, then http://127.0.0.1:8080 (mise run server:tunnel [-- --port N])"
run = "deploy/server/tunnel.sh"

[tasks."server:check"]
description = "Check deploy/server/ without a server: ansible-lint and the playbook's syntax"
dir = "deploy/server"
run = [
  "ansible-lint",
  "ansible-playbook -i inventory.ini.example --syntax-check site.yml",
]

[tasks."server:test-setup"]
description = "Test the server setup scripts (deploy/server/setup-*.sh) against a throwaway Ubuntu 24.04 container, in about a minute; needs Docker or Podman"
run = "deploy/server/test-setup.sh"

# Changes the machine it runs on for good: CI runners and throwaway VMs only (it refuses otherwise).
[tasks."server:test"]
description = "End-to-end test of the server deployment on THIS machine as the server (throwaway machines only: CI, or SERVER_TEST_THROWAWAY=1): the README's setup scripts, a deploy over SSH to 127.0.0.1, idempotency, the tunnel, the firewall, a backup"
run = "deploy/server/test-deploy.sh"

[tasks.clean]
description = "Remove build outputs"
run = "./gradlew clean"
