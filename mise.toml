# Developer entry points and the tools they need. `mise install` fetches the tools below into mise's
# own directory (nothing system-wide); `mise run <task>` runs a task with them on PATH and
# JAVA_HOME set. `mise tasks` lists the tasks.
#
# One JDK serves everything: Gradle runs on it, the backend's Java 25 toolchain finds it, and the
# jar runs on it. Node.js and pnpm are still downloaded by the build; uv downloads Python 3.12.

[tools]
java = "temurin-25"
uv = "0.12"
# Git hooks (lefthook.yml): `mise run hooks` installs them.
lefthook = "2.1"

[tasks.setup]
description = "Install ta-runner (TradingAgents + deps), the frontend's packages and the Git hooks"
run = [
  "cd artifact/ta-runner && uv sync",
  "./gradlew :frontend:pnpmInstall",
  { task = "hooks" },
]

[tasks.hooks]
description = "Install the Git hooks (lefthook.yml): lint and import checks on staged files before a commit"
run = "lefthook install"

# The platform's PostgreSQL 18 (scripts/postgres.sh): a local container, in Docker or Podman, that
# run and dev start on their own. PLATFORM_DB_HOST (and _PORT, _NAME, _USER, _PASSWORD) point the
# platform at your own server instead, and then no container is started; for a server on localhost
# also set PLATFORM_DB_CONTAINER=false.
[tasks.db]
description = "Start the local PostgreSQL for run and dev (Docker or Podman), unless PLATFORM_DB_CONTAINER=false or PLATFORM_DB_HOST points elsewhere"
run = "scripts/postgres.sh start"

[tasks."db:stop"]
description = "Stop the local PostgreSQL container; its data stays in the volume trading-analysis-platform-db"
run = "scripts/postgres.sh stop"

[tasks."db:reset"]
description = "Remove the local PostgreSQL container and its volume: the next start is an empty database"
run = "scripts/postgres.sh reset"

[tasks.dev]
description = "Backend on :8080 and Vite (hot reload) on :5173, together; open http://localhost:5173. Starts the local PostgreSQL (mise run db)"
depends = ["db"]
run = "./gradlew --parallel --console=plain :backend:bootRun :frontend:pnpmDev"

[tasks.build]
description = "Test everything and build the single jar (backend + UI); the backend tests need Docker or Podman"
run = "./gradlew build"

[tasks.runner-test]
description = "ta-runner lint, import contracts, dependency check (deptry) and tests"
dir = "artifact/ta-runner"
run = ["uv run ruff check .", "uv run lint-imports", "uv run deptry .", "uv run pytest -q"]

[tasks.e2e]
description = "End-to-end tests (e2e/, Playwright): the built jar on a throwaway PostgreSQL container (Docker or Podman) with ta-runner replaying a recording, in a real browser"
# Runs in the installed Google Chrome; E2E_BROWSER_CHANNEL picks another browser channel.
run = [
  "./gradlew --console=plain :backend:bootJar",
  "cd artifact/ta-runner && uv sync",
  "e2e/with-node.sh pnpm install --frozen-lockfile",
  "e2e/with-node.sh pnpm test",
]

[tasks.screenshots]
description = "Take the README's screenshots (e2e/screenshots/*.shot.ts) into docs/screenshots/: mise run screenshots [name filter]; needs Docker or Podman"
# Like the end-to-end tests: the built jar on a throwaway PostgreSQL container with ta-runner
# replaying a recording, in Google Chrome.
run = [
  "./gradlew --console=plain :backend:bootJar",
  "cd artifact/ta-runner && uv sync",
  "e2e/with-node.sh pnpm install --frozen-lockfile",
  "e2e/with-node.sh pnpm run screenshots",
]

[tasks.check]
description = "Quick check before pushing: package structure (ArchUnit, ESLint, import-linter), lint (Checkstyle, ESLint, ruff), formatting (Spotless, Prettier), type-check, dependency declarations (Gradle analysis, Knip, deptry), a conventions test in every domain with persistence, the custom Checkstyle checks' own tests, the agent scripts' and the Claude Code skills' Python tests; no other tests"
run = [
  "./gradlew --console=plain spotlessCheck checkstyleRulesCheck checkstyleMain checkstyleTest :backend:test --tests '*ArchitectureTest' :backend:domainPersistenceTestsCheck :frontend:pnpmLint :frontend:pnpmDepsCheck analyzeDependencies",
  "artifact/frontend/with-node.sh pnpm run type-check",
  "e2e/with-node.sh pnpm run type-check",
  "cd artifact/ta-runner && uv run ruff check . && uv run lint-imports && uv run deptry .",
  { task = "agent:test" },
  { task = "skill:test" },
]

# Formatting of every file: Java (Spotless, Palantir Java Format), the frontend and e2e/ (Prettier).
# ta-runner has no formatter yet.
[tasks.format]
description = "Format every Java (Spotless) and frontend (Prettier) file"
run = [
  "./gradlew --console=plain spotlessApply :frontend:pnpmInstall",
  "artifact/frontend/with-node.sh pnpm exec prettier --write .",
  "e2e/with-node.sh sh -c 'pnpm install --frozen-lockfile && pnpm run format'",
]

[tasks.format-check]
description = "Check the formatting of every Java (Spotless) and frontend (Prettier) file, as CI does"
run = [
  "./gradlew --console=plain spotlessCheck :frontend:pnpmInstall",
  "artifact/frontend/with-node.sh pnpm exec prettier --check .",
  "e2e/with-node.sh sh -c 'pnpm install --frozen-lockfile && pnpm run format-check'",
]

[tasks.test]
description = "All tests: backend (needs Docker or Podman), frontend, ta-runner"
depends = ["build", "runner-test"]

[tasks.run]
description = "Build the single jar (UI included) if anything changed and run it on http://127.0.0.1:8080, on the local PostgreSQL (mise run db)"
depends = ["db"]
# bootJar is up to date in seconds when nothing changed, and rebuilds after a git pull.
run = [
  "./gradlew --console=plain :backend:bootJar",
  "java -jar artifact/backend/build/libs/platform.jar",
]

[tasks.api-types]
description = "Refresh openapi.json and the frontend's API types from the running backend (start mise run dev first)"
run = [
  "curl -fsS http://localhost:8080/api/openapi | uv run --no-project python -m json.tool --indent 4 --no-ensure-ascii > artifact/frontend/openapi.json",
  "./gradlew --console=plain :frontend:pnpmApiTypes",
]

[tasks.docker-build]
description = "Build the Docker images: the platform (backend + UI jar) and ta-runner (see deploy/)"
# One after the other: both are bound by writing image layers, and building them side by side only
# makes them compete for the disk (slow inside Podman's VM on macOS).
# Tagged with the version and latest; the Compose setup uses latest unless deploy/.env says otherwise.
run = [
  "./gradlew --console=plain :backend:bootJar",
  "v=$(scripts/version.sh) && docker build -f deploy/Dockerfile --build-arg VERSION=$v -t trading-analysis-platform:$v -t trading-analysis-platform:latest .",
  "v=$(scripts/version.sh) && docker build --build-arg VERSION=$v -t ta-runner:$v -t ta-runner:latest artifact/ta-runner",
]

# One version for the whole repository (docs/coding-convention/repository-versioning-and-releases.md): every
# pull request into main raises it (Renovate's update pull requests excepted), and merging it
# releases vX.Y.Z.
[tasks.version]
description = "Print the platform version (gradle.properties)"
run = "scripts/version.sh"

[tasks."version:bump"]
description = "Raise the version in gradle.properties, package.json and ta-runner: mise run version:bump major|minor|patch"
run = "scripts/version.sh bump"

# Agentic development (docs/agentic-development.md): issue → plan →
# agent implementation → agent review → pull request, on this machine with Claude Code and your own
# Claude Code login. Planning is the plan-from-issue Claude Code skill.
[tasks."agent:plan-branch"]
description = "Push a plan on its own branch: mise run agent:plan-branch .plans/<issue>-<slug>.md"
run = "scripts/agent/plan-branch.sh"

[tasks."agent:run"]
description = "Agents take an approved plan to a pull request ready for review: mise run agent:run plan/<issue>-<slug>"
run = "scripts/agent/run.sh"

[tasks."agent:implement"]
description = "Only the implementation and the draft PR: mise run agent:implement plan/<issue>-<slug>"
run = "scripts/agent/implement.sh"

[tasks."agent:next"]
description = "Continue the review → fix loop of an agent PR to its end: mise run agent:next plan/<issue>-<slug>"
run = "scripts/agent/next.sh"

[tasks."agent:detach"]
description = "Start an agent script detached from the terminal, its output in the plan branch's run.log: mise run agent:detach <script> plan/<issue>-<slug> (or a PR number)"
run = "scripts/agent/detach.sh"

[tasks."agent:status"]
description = "Where an agent run is: active pid, work package, latest milestones and log lines: mise run agent:status plan/<issue>-<slug> (or a PR number)"
run = "scripts/agent/status.sh"

[tasks."agent:test"]
description = "Python tests of the agent scripts (scripts/agent/test_*.py): the plan parser and the usage figures"
run = "uv run --no-project python -m unittest discover -s scripts/agent -p 'test_*.py'"

[tasks."skill:test"]
description = "Python tests of the Claude Code skills' helpers (.claude/skills/dependabot-fix/test_*.py)"
run = "uv run --no-project python -m unittest discover -s .claude/skills/dependabot-fix -p 'test_*.py'"

[tasks.clean]
description = "Remove build outputs"
run = "./gradlew clean"
