# Single source of truth for versions. Bump here, nowhere else.
[versions]
# Java 25 LTS. Non-LTS releases reach end of life after six months.
java = "25"
springBoot = "4.1.1"
# springdoc 3.x is the line built for Spring Boot 4.
springdoc = "3.1.1"
archunit = "1.5.0"
# Static checks on backend sources (config/checkstyle/). 11+ parses Java 25 syntax.
checkstyle = "14.3.0"
# Java formatting (Spotless with Palantir Java Format: 120 columns, matching Checkstyle's LineLength).
spotless = "8.10.3"
palantirJavaFormat = "2.101.0"
# Coverage gate of the custom Checkstyle checks (build-logic/checkstyle-rules). 0.8.14+ reads Java 25 classes.
jacoco = "0.8.15"
mapstruct = "1.6.3"
# Docker Engine API client for the Docker runner (also talks to Podman's Docker-compatible API).
dockerJava = "3.7.1"
# Frontend toolchain, downloaded by the node-gradle plugin: no global Node needed for a build.
nodeGradle = "7.1.0"
node = "24.21.0"
pnpm = "12.6.0"
# Fails the build on used-but-undeclared and declared-but-unused dependencies of the backend modules.
dependencyAnalyze = "2.0.0"

# Security pins (Dependabot): transitive dependencies held at a patched, mature (14+ days old) release
# because their parent still brings a vulnerable one. The pins sit in the convention plugin (runtime
# and test classpaths) and in the root build.gradle.kts (build script classpath).
# Jackson 2 (com.fasterxml.jackson.core), alerts on jackson-core and jackson-databind: 2.14.2 on the
# build script classpath (node-gradle plugin), 2.21.5 / 2.22.1 at runtime (docker-java-core, Spring
# Boot's BOM, swagger-core-jakarta). Remove when docker-java > 3.7.1, springdoc > 3.1.1 and
# node-gradle > 7.1.0 bring >= 2.22.3.
jackson2 = "2.22.3"
# Jackson 3 (tools.jackson.core), alerts on jackson-core and jackson-databind: 3.1.5 from Spring Boot
# 4.1.1's BOM and the Spring Boot Gradle plugin. Stays on Spring Boot 4.1's 3.1 line. Remove when
# Spring Boot > 4.1.1 brings >= 3.1.7.
jackson3 = "3.1.7"
# Bouncy Castle, alerts on bcprov, bcpkix and bcutil: 1.82 from docker-java-core 3.7.1. Remove when
# docker-java > 3.7.1 brings >= 1.86.
bouncycastle = "1.86"

[libraries]
# BOM. The Spring Boot Gradle plugin does NOT apply dependency management on its own,
# so the platform must be imported explicitly - otherwise starters resolve to no version.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# Versions below come from the BOM.
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
spring-boot = { module = "org.springframework.boot:spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-data-jpa = { module = "org.springframework.boot:spring-boot-data-jpa" }
spring-boot-hibernate = { module = "org.springframework.boot:spring-boot-hibernate" }
spring-boot-transaction = { module = "org.springframework.boot:spring-boot-transaction" }
spring-context = { module = "org.springframework:spring-context" }
spring-beans = { module = "org.springframework:spring-beans" }
spring-core = { module = "org.springframework:spring-core" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-web = { module = "org.springframework:spring-web" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
spring-test = { module = "org.springframework:spring-test" }
spring-data-commons = { module = "org.springframework.data:spring-data-commons" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }
# The Spring Data repositories and Specifications of the persistence adapters; spring-jdbc stays on
# the classpath through spring-orm but no code uses it (docs/coding-convention/backend-java-persistence.md).
spring-data-jpa = { module = "org.springframework.data:spring-data-jpa" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api" }
# For @JdbcTypeCode (PostgreSQL enum and array columns).
hibernate-core = { module = "org.hibernate.orm:hibernate-core" }
jackson-core = { module = "tools.jackson.core:jackson-core" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
flyway-core = { module = "org.flywaydb:flyway-core" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# Only the crypto module (password hashing), not the starter: the starter would lock every endpoint.
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core" }
# The Checkstyle API the custom checks are written against; the same version runs the checks.
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }

springdoc-openapi-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
archunit-junit5-api = { module = "com.tngtech.archunit:archunit-junit5-api", version.ref = "archunit" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
docker-java-api = { module = "com.github.docker-java:docker-java-api", version.ref = "dockerJava" }
docker-java-transport = { module = "com.github.docker-java:docker-java-transport", version.ref = "dockerJava" }
docker-java-core = { module = "com.github.docker-java:docker-java-core", version.ref = "dockerJava" }
docker-java-transport-httpclient5 = { module = "com.github.docker-java:docker-java-transport-httpclient5", version.ref = "dockerJava" }
# Security pins (Dependabot), versions above.
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jackson2-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson2" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3" }
jackson3-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson3" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
# Gradle plugin used by the build-logic convention plugins.
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
dependency-analyze-gradle-plugin = { module = "ca.cutterslade.analyze:ca.cutterslade.analyze.gradle.plugin", version.ref = "dependencyAnalyze" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
node = { id = "com.github.node-gradle.node", version.ref = "nodeGradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
dependency-analyze = { id = "ca.cutterslade.analyze", version.ref = "dependencyAnalyze" }
