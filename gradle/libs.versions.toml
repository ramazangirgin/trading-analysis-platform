# Single source of truth for versions. Bump here, nowhere else.
[versions]
# Java 25 LTS. Non-LTS releases reach end of life after six months.
java = "25"
springBoot = "4.1.1"
# springdoc 3.x is the line built for Spring Boot 4.
springdoc = "3.1.1"
archunit = "1.5.0"
# Static checks on backend sources (config/checkstyle/). 11+ parses Java 25 syntax.
checkstyle = "14.3.0"
# Java formatting (Spotless with Palantir Java Format: 120 columns, matching Checkstyle's LineLength).
spotless = "8.10.3"
palantirJavaFormat = "2.101.0"
# Coverage gate of the custom Checkstyle checks (build-logic/checkstyle-rules). 0.8.14+ reads Java 25 classes.
jacoco = "0.8.14"
mapstruct = "1.6.3"
# Docker Engine API client for the Docker runner (also talks to Podman's Docker-compatible API).
dockerJava = "3.7.1"
# Frontend toolchain, downloaded by the node-gradle plugin: no global Node needed for a build.
nodeGradle = "7.1.0"
node = "24.21.0"
pnpm = "12.9.1"

[libraries]
# BOM. The Spring Boot Gradle plugin does NOT apply dependency management on its own,
# so the platform must be imported explicitly - otherwise starters resolve to no version.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# Versions below come from the BOM.
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-context = { module = "org.springframework:spring-context" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
flyway-core = { module = "org.flywaydb:flyway-core" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core" }
# The Checkstyle API the custom checks are written against; the same version runs the checks.
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }

springdoc-openapi-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
docker-java-core = { module = "com.github.docker-java:docker-java-core", version.ref = "dockerJava" }
docker-java-transport-httpclient5 = { module = "com.github.docker-java:docker-java-transport-httpclient5", version.ref = "dockerJava" }
# Gradle plugin used by the build-logic convention plugins.
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
node = { id = "com.github.node-gradle.node", version.ref = "nodeGradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
